name: test

on:
  push:
    branches: [main]
    # a tag of the root runs these checks through the release workflow
    tags: ["store/*/v*", "resolve/*/v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes are metered at a higher rate in a private repository
        # macOS therefore runs on tags only
        os: ${{ startsWith(github.ref, 'refs/tags/') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        module: [".", "store/redis", "store/kafka", "resolve/jev", "bench"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go-version-file is read from the repository root and ignores the working directory
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: go vet
        if: runner.os == 'Linux'
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: runner.os == 'Linux'
        with:
          version: v2.14
          working-directory: ${{ matrix.module }}
      - name: go test
        run: go test -race -coverprofile=cover.out ./...
      # go.work resolves the untagged root for local work
      # A tag of a module also builds it the way a user does
      - name: build without the workspace
        if: matrix.module != '.' && startsWith(github.ref, format('refs/tags/{0}/', matrix.module))
        env:
          GOWORK: "off"
        run: go build ./...
      - name: Coverage summary
        if: runner.os == 'Linux'
        run: |
          {
            echo "### Coverage of ${{ matrix.module }}"
            echo '```'
            go tool cover -func=cover.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The store contract suite against real servers
  stores:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
    env:
      MOLDRAIN_TEST_REDIS: localhost:6379
      MOLDRAIN_TEST_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: store/redis/go.mod
      - name: redis store
        working-directory: store/redis
        run: go test -race -tags integration ./...
      - name: kafka store
        working-directory: store/kafka
        run: go test -race -tags integration ./...
