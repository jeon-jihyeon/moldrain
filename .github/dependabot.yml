version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /store/redis
      - /store/kafka
      - /resolve/jev
      - /bench
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
